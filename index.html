<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cello Bow Collection | Interactive Index & Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --gold: #d4af37;
      --gold-dim: #997b24;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --tag-bg: #21262d;
      --accent: #58a6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    header {
      text-align: center;
      max-width: 900px;
      margin: 0 auto 2.5rem auto;
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.4rem;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }
    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Section Headers */
    .section-title {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      font-size: 1.4rem;
      max-width: 1200px;
      margin: 0 auto 1.25rem auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Charts Container */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto 3.5rem auto;
    }
    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      position: relative;
    }
    .chart-card.wide {
      grid-column: 1 / -1;
    }
    .chart-header {
      margin-bottom: 1rem;
    }
    .chart-header h3 {
      font-size: 1.05rem;
      color: var(--text-main);
      font-weight: 600;
    }
    .chart-header p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .canvas-container {
      position: relative;
      height: 280px;
      width: 100%;
    }
    .canvas-container.tall {
      height: 380px;
    }

    /* Control Panel */
    .controls {
      max-width: 1200px;
      margin: 0 auto 1.5rem auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }
    .search-box {
      flex: 1 1 250px;
    }
    .search-box input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.6rem 1rem;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }
    .search-box input:focus { border-color: var(--gold); }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }
    select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.6rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: var(--gold); }

    /* Summary Bar */
    .counter {
      max-width: 1200px;
      margin: 0 auto 1.5rem auto;
      color: var(--text-muted);
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      padding: 0 0.5rem;
    }

    /* Bow Grid */
    .bow-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--gold-dim);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }
    .maker-name {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      color: var(--gold);
      font-weight: 700;
    }
    .obj-number {
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--tag-bg);
      border: 1px solid var(--border);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      color: var(--text-muted);
    }
    .attribution {
      font-size: 0.9rem;
      color: var(--text-main);
      margin-bottom: 0.3rem;
    }
    .origin-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    /* Tags */
    .tags {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .tag {
      font-size: 0.72rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-weight: 500;
    }

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cello Bow Collection | Index & Analytics</title>
  <!-- Chart.js CDN (with defer to prevent render blocking) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --gold: #d4af37;
      --gold-dim: #997b24;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --tag-bg: #21262d;
      --blue: #58a6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    header {
      text-align: center;
      max-width: 900px;
      margin: 0 auto 2.5rem auto;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.2rem;
      letter-spacing: 1.5px;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }
    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .section-title {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--gold);
      font-size: 1.3rem;
      max-width: 1200px;
      margin: 0 auto 1.25rem auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Charts Layout */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto 3rem auto;
    }
    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
    }
    .chart-card.wide {
      grid-column: 1 / -1;
    }
    .chart-header {
      margin-bottom: 1rem;
    }
    .chart-header h3 {
      font-size: 1rem;
      color: var(--text-main);
      font-weight: 600;
    }
    .chart-header p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .canvas-container {
      position: relative;
      height: 260px;
      width: 100%;
    }
    .canvas-container.tall {
      height: 340px;
    }

    /* Filter Controls */
    .controls {
      max-width: 1200px;
      margin: 0 auto 1.5rem auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }
    .search-box {
      flex: 1 1 250px;
    }
    .search-box input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.6rem 1rem;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }
    .search-box input:focus { border-color: var(--gold); }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }
    select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.6rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: var(--gold); }

    .counter {
      max-width: 1200px;
      margin: 0 auto 1.5rem auto;
      color: var(--text-muted);
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      padding: 0 0.5rem;
    }

    /* Cards Grid */
    .bow-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--gold-dim);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
    }
    .maker-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.25rem;
      color: var(--gold);
      font-weight: 700;
    }
    .obj-number {
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--tag-bg);
      border: 1px solid var(--border);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      color: var(--text-muted);
    }
    .attribution {
      font-size: 0.9rem;
      color: var(--text-main);
      margin-bottom: 0.2rem;
    }
    .origin-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .tags {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .tag {
      font-size: 0.72rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-weight: 500;
    }
    .tag-school { background: rgba(88, 166, 255, 0.15); color: var(--blue); }
    .tag-shape { background: rgba(212, 175, 55, 0.15); color: var(--gold); }
    .tag-loc { background: rgba(139, 148, 158, 0.15); color: var(--text-muted); }

    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      text-align: center;
      padding: 0.75rem 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.25rem;
    }
    .stat-val {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
    }
    .stat-lbl {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .gauge
